name: Fetch News

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and can lag
    # during high load -- don't rely on it for sub-minute freshness.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news and fact-check matches
        env:
          GOOGLE_FACT_CHECK_API_KEY: ${{ secrets.GOOGLE_FACT_CHECK_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit updated feed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "chore: refresh news feed [skip ci]"
          git push
